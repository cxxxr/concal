services:
  postgres:
    image: postgres:16-alpine
    container_name: concal-postgres
    environment:
      POSTGRES_USER: concal
      POSTGRES_PASSWORD: concal_password
      POSTGRES_DB: concal
    ports:
      - "5432:5432"
    volumes:
      - concal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concal -d concal"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: concal-app
    ports:
      - "8080:8080"
    environment:
      CONCAL_DB_HOST: postgres
      CONCAL_DB_PORT: "5432"
      CONCAL_DB_NAME: concal
      CONCAL_DB_USER: concal
      CONCAL_DB_PASSWORD: concal_password
      CONCAL_HOST: "0.0.0.0"
      CONCAL_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  concal-postgres-data:
